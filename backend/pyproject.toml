[project]
name = "agentcart-backend"
version = "0.1.0"
description = "AgentCart FastAPI backend — catalog, ranking, AI tools, PayPal Sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "google-genai>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
